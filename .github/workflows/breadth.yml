name: A-share Market Breadth

on:
  schedule:
    # GitHub Actions 的 cron 一律按 UTC 解释；UTC 08:30 = 北京 16:30
    - cron: '30 8 * * 1-5'
    # 兜底：北京时间 18:00。若 16:30 那次失败，这次真正重算；
    # 若已成功，脚本会读辅助源日期幂等跳过，几乎零成本
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      limit:
        description: '只取前 N 只股票（0 = 全市场，调试用）'
        required: false
        default: '0'
      force:
        description: '强制重算（跳过幂等判断）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: market-breadth
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # v3.14：单次全量重算约 51 分钟；预留一次自动重试 + 余量
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      A_STOCK_API_KEY: ${{ secrets.A_STOCK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute market breadth
        env:
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          # v3.12：probe-sources.yml 已在海外 runner 连续两次验证 OVERSEAS_RUNNER_OK
          # （新浪逐股 95%/100%、腾讯 100%/100%），据此启用逐股历史按只 fallback。
          # 东财正常时所有股票都走主源，口径与 v3.11 完全一致；仅东财限流时才混源。
          # 限流解除、连续 2 次全量取数成功率 >=95% 后按 README 12.4-H 置回 "0"。
          HIST_FALLBACK: "1"
        run: |
          ARGS="--out docs"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          # v3.14：底层 C 扩展偶发崩溃（segfault 139）或 push2 临时限流时自动重试一次。
          # v3.15a（2026-11-17）：复核发现偶发原生崩溃与 runner 镜像 / 取数并发相关；
          # 首次仍用默认并发，重试时降到 4（breadth.py 已有 --workers 参数），
          # 减少 akshare / curl_cffi / pandas / numpy C 层并发竞争。
          # 成功立刻结束本 step；两次都失败才让 job 变红，提交步骤会被跳过，
          # 已有 docs/ 产物不会被有偏样本覆盖。
          for attempt in 1 2; do
            ATTEMPT_ARGS="$ARGS"
            if [ "$attempt" -eq 2 ]; then
              ATTEMPT_ARGS="$ATTEMPT_ARGS --workers 4"
            fi
            echo "::group::Compute attempt ${attempt}/2"
            echo "Compute args: $ATTEMPT_ARGS"
            if python breadth.py $ATTEMPT_ARGS; then
              echo "::endgroup::"
              echo "第 ${attempt} 次重算成功"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::连续 2 次重算失败，本次不覆盖已有结果"
              exit 1
            fi
            echo "第 1 次失败，等待 60 秒后重试（不动已有产物；并发降至 4）"
            sleep 60
          done

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs codes.txt
          if git diff --cached --quiet; then
            echo "数据未变化（非交易日 / 已幂等跳过），不提交"
          else
            git commit -m "chore: update market breadth $(date +%F)"
            git pull --rebase origin main
            git push
          fi
